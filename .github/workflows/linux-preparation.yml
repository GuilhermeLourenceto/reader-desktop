name: Linux Desktop preparation (experimental)

on:
  push:
    branches:
      - linux/prepare-packaging-and-tests
    paths:
      - 'desktop/**'
      - '.github/workflows/linux-preparation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-smoke-and-packages:
    name: Linux x64 / Electron smoke + AppImage + deb
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install minimal headless display dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Install isolated Desktop dependencies
        run: npm ci
      - name: Install matching Electron runtime
        run: npm run setup
      - name: Verify Desktop is independent from Android sources
        run: node scripts/check-standalone.cjs
      - name: Compile the same application used on Windows
        run: npm run build
      - name: Run portable unit tests
        run: npm test
      - name: Exercise source loading, library and backup on Linux
        timeout-minutes: 3
        run: xvfb-run -a npx electron --no-sandbox test/smoke.cjs --visual-preview
      - name: Exercise Linux source scrolling and pagination
        timeout-minutes: 3
        run: xvfb-run -a npx electron --no-sandbox test/pagination-smoke.cjs --visual-preview
      - name: Exercise reading progress and offline chapters
        timeout-minutes: 3
        run: xvfb-run -a npx electron --no-sandbox test/reader-rules-smoke.cjs --visual-preview
      - name: Build experimental Linux x64 AppImage and Debian package
        timeout-minutes: 12
        run: npm run dist:linux
      - name: Inspect installable files and desktop integration
        run: bash scripts/verify-linux-packages.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lnreader-linux-experimental-x64
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
          retention-days: 14
