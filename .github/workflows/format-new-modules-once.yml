name: One-time format of extracted Desktop modules
on:
  push:
    branches: [seguranca-e-estabilidade]
    paths:
      - '.github/workflows/format-new-modules-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - working-directory: desktop
        run: npm ci
      - name: Format only newly extracted source modules
        working-directory: desktop
        run: npx --no-install prettier --write src/Icon.jsx src/SourceFilters.jsx src/DesktopErrorBoundary.jsx src/libraryState.js src/sourceRuntime.js
      - name: Commit isolated formatting changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/src/Icon.jsx desktop/src/SourceFilters.jsx desktop/src/DesktopErrorBoundary.jsx desktop/src/libraryState.js desktop/src/sourceRuntime.js
          if ! git diff --cached --quiet; then
            git commit -m 'style(desktop): format extracted React and runtime modules'
            git push origin HEAD:seguranca-e-estabilidade
          fi
