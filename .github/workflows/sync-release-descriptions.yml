name: Sync published release descriptions

on:
  push:
    branches:
      - main
    paths:
      - 'desktop/docs/RELEASE_NOTES_0.4.0.md'
      - 'desktop/docs/RELEASE_NOTES_0.4.1.md'
      - '.github/workflows/sync-release-descriptions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-notes:
    name: Update existing release notes (preserve tags and installers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update release descriptions only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for version in 0.4.0 0.4.1; do
            tag="v${version}"
            notes="desktop/docs/RELEASE_NOTES_${version}.md"
            test -s "$notes"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file "$notes"
            echo "Updated $tag without modifying its title, tag or assets."
          done
