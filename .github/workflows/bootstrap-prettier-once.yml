name: One-time setup of pinned desktop formatter
on:
  push:
    branches: [seguranca-e-estabilidade]
    paths:
      - '.github/workflows/bootstrap-prettier-once.yml'

permissions:
  contents: write

jobs:
  add-prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate official lockfile for pinned Prettier
        working-directory: desktop
        run: npm install --save-dev --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund prettier@3.6.2
      - name: Commit package metadata and lockfile only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/package.json desktop/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(desktop): pin Prettier and reproducible dependency lock'
            git push origin HEAD:seguranca-e-estabilidade
          fi
