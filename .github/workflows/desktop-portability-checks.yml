name: Windows + Linux code portability (no packages)

# Tests only: does not build, package, publish, or upload artifacts.
on:
  push:
    branches: [linux/prepare-packaging-and-tests]
    paths:
      - '.github/workflows/desktop-portability-checks.yml'
      - 'desktop/scripts/**'
      - 'desktop/test/**'
      - 'desktop/src/**'
      - 'desktop/build/**'
      - 'desktop/build.mjs'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - 'desktop/.gitattributes'
      - 'desktop/vendor/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-windows-and-linux:
    name: Code/SDK portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies without building app
        run: npm ci
      - name: Audit all code, tools and original SDK for external paths
        run: node scripts/check-standalone.cjs
      - name: Validate importer and icon-script syntax
        run: node --check scripts/sync-original-sdk.cjs && node --check build/make-icon.cjs
        shell: bash
      - name: Compile temporary test modules (no installers)
        run: npm run build
      - name: Run isolated importer and unit regression tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Verify code formatting
        run: npm run format:check
