name: One-time copy of original SDK into desktop/vendor

on:
  push:
    branches: [seguranca-e-estabilidade]
    paths: [.github/workflows/desktop-vendor-once.yml]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node desktop/scripts/sync-original-sdk.cjs
      - name: Verify all pinned SDK and binary assets were copied
        run: |
          test -f desktop/vendor/lnreader/src/plugins/pluginManager.ts
          test -f desktop/vendor/lnreader/src/theme/md3/defaultTheme.ts
          test -f desktop/vendor/lnreader/assets/native/ic_launcher.png
          test -f desktop/vendor/lnreader/assets/reader/fonts/noto-sans.ttf
          test -f desktop/vendor/lnreader/origin.json
      - name: Commit only the Desktop SDK snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/vendor/lnreader
          if ! git diff --cached --quiet; then
            git commit -m 'build: vendor pinned LNReader plugin SDK and assets inside desktop'
            git push origin HEAD:seguranca-e-estabilidade
          fi
