name: Publish tested Windows release
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Desktop builds run for the v0.4.0 commit
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-windows-v040
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.4.0
      - name: Verify the build matches the release tag
        uses: actions/github-script@v7
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        with:
          script: |
            if (!/^\d+$/.test(process.env.BUILD_RUN_ID)) throw new Error('Invalid build run ID');
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(process.env.BUILD_RUN_ID) });
            const { execFileSync } = require('node:child_process');
            const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            if (run.head_sha !== sha || run.conclusion !== 'success' || run.path !== '.github/workflows/desktop.yml') {
              throw new Error('A successful Desktop build of the release commit is required');
            }
      - uses: actions/download-artifact@v4
        with:
          name: lnreader-desktop-Windows
          path: release-artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
      - name: Upload tested Windows installer and update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($version -ne '0.4.0') { throw 'Unexpected release version' }
          $installer = @(Get-ChildItem release-artifacts -Recurse -File -Filter '*.exe')
          if ($installer.Count -ne 1 -or $installer[0].Length -eq 0) { throw 'Expected exactly one installer' }
          gh release upload v0.4.0 $installer[0].FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Installer upload failed' }
          gh release edit v0.4.0 --title 'LNReader Desktop 0.4.0 Beta' --notes-file desktop/docs/RELEASE_NOTES_0.4.0.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release notes update failed' }
          Get-FileHash $installer[0].FullName -Algorithm SHA256 | Format-List
