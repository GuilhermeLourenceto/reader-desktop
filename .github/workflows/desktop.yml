name: Desktop builds
on:
  workflow_dispatch:
    inputs:
      include_linux:
        description: 'Também compilar e testar Linux (port ainda pendente de validação)'
        type: boolean
        default: false
  push:
    paths:
      - 'desktop/**'
      - 'src/plugins/**'
      - 'src/services/backup/types.ts'
      - 'src/services/backup/options.ts'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/plugins/**'
      - 'src/services/backup/types.ts'
      - 'src/services/backup/options.ts'
      - '.github/workflows/desktop.yml'
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desktop-only:
    name: Standalone Desktop build (no Android files)
    if: github.ref_name == 'seguranca-e-estabilidade'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          # Only desktop/ exists in this checkout. Parent Android sources,
          # package files, fonts and license are intentionally unavailable.
          sparse-checkout: desktop
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: node scripts/check-standalone.cjs
      - run: npm run setup
      - run: npm run build
      - run: npm test
      - run: npm run test:smoke
      - run: npm run test:reader

  package:
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_linux && '["windows-latest","ubuntu-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run setup
      - run: npm run build
      - run: npm test
      - if: runner.os == 'Windows'
        run: npm run test:smoke
      - if: runner.os == 'Windows'
        run: npm run test:pagination
      - if: runner.os == 'Windows'
        run: npm run test:reader
      - if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox test/smoke.cjs --visual-preview
      - if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox test/pagination-smoke.cjs --visual-preview
      - if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox test/reader-rules-smoke.cjs --visual-preview
      - if: runner.os == 'Windows'
        run: npm run dist:win
      - if: runner.os == 'Linux'
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: lnreader-desktop-${{ runner.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb

  user-journeys:
    name: Everyday reading scenarios (10 Electron journeys)
    if: github.ref_name == 'seguranca-e-estabilidade'
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run setup
      - run: npm run build
      - name: Test 10 everyday user journeys from real reader issues
        run: node test/user-journeys.cjs
        timeout-minutes: 24
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: everyday-user-journeys
          path: desktop/.tmp/user-journeys-results.json

  source-matrix:
    name: Real plugin sources (diagnostic only)
    if: github.ref_name == 'seguranca-e-estabilidade'
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run setup
      - run: npm run build
      - name: Test browser login cookie isolation
        run: npx electron test/auth-cookie-smoke.cjs
      - name: Test interactive source login and OAuth popup
        run: npx electron test/source-login-e2e.cjs
        timeout-minutes: 2
      - name: Central Novel route comparison (isolated source session)
        run: npx electron test/central-route-diagnostic.cjs --source-session
        timeout-minutes: 3
      - name: Test 16 independent sources
        run: node test/source-matrix.cjs
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lnreader-source-matrix
          path: desktop/.tmp/source-matrix/
