name: Desktop builds
on:
  workflow_dispatch:
  # The current main matrix already includes Windows and Ubuntu.
  # Manual runs are useful for diagnosing failures and obtaining artifacts.
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    name: Code quality and formatting (Desktop)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  desktop-only:
    name: Standalone Desktop build (no Android files)
    if: github.ref_name == 'main' || github.event_name == 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          # Only desktop/ exists in this checkout. Parent Android sources,
          # package files, fonts and license are intentionally unavailable.
          sparse-checkout: desktop
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: node scripts/check-standalone.cjs
      - run: npm run setup
      - run: npm run build
      - run: npm test
      - run: npm run test:smoke
      - run: npm run test:reader

  package:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Prepare Linux headless test display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci
      - run: node scripts/check-standalone.cjs
      - run: npm run setup
      - run: npm run build
      - run: npm test
      # Run the real Updates page with a deliberately slow local source,
      # checking computed geometry and saving a compact-window screenshot.
      - name: Audit live Updates progress layout (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: npx electron test/updates-smoke.cjs
      - name: Audit live Updates progress layout (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: xvfb-run -a npx electron --no-sandbox test/updates-smoke.cjs --visual-preview
      - if: runner.os == 'Windows'
        run: npm run test:smoke
      - if: runner.os == 'Windows'
        run: npm run test:pagination
      - if: runner.os == 'Windows'
        run: npm run test:reader
      - name: Verify all ten interface languages, new library filters and context menus (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: npx electron test/localization-smoke.cjs
      - name: Verify all ten interface languages, new library filters and context menus (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run -a npx electron --no-sandbox test/localization-smoke.cjs --visual-preview
      - name: English first launch and English reset (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: npx electron test/default-language-smoke.cjs
      - name: Run 18 adversarial Electron/UI/backup journeys on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run -a npx electron --no-sandbox test/extreme-journeys-smoke.cjs --visual-preview
      - name: English first launch and English reset (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: xvfb-run -a npx electron --no-sandbox test/default-language-smoke.cjs --visual-preview
      - name: Real public DNS and source-session HTTP probe
        if: runner.os == 'Windows'
        run: npx electron test/dns-public-smoke.cjs
      - if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox test/smoke.cjs --visual-preview
      - name: Exercise library filters, context, selection and all theme palettes (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: xvfb-run -a npx electron --no-sandbox test/library-search-smoke.cjs --visual-preview
      - if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox test/pagination-smoke.cjs --visual-preview
      - if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox test/reader-rules-smoke.cjs --visual-preview
      - name: Audit real dropdown spacing and rounded control geometry (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: npx electron test/control-layout-smoke.cjs
      - name: Audit real dropdown spacing and rounded control geometry (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: xvfb-run -a npx electron --no-sandbox test/control-layout-smoke.cjs --visual-preview
      - name: Verify the loading spinner really animates (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: npx electron test/spinner-animation-smoke.cjs
      - name: Verify the loading spinner really animates (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: xvfb-run -a npx electron --no-sandbox test/spinner-animation-smoke.cjs --visual-preview
      - name: Ensure 10k-book library remains virtualized (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 4
        run: npx electron test/huge-library-ui-smoke.cjs --visual-preview
      - name: Ensure 10k-book library remains virtualized (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: xvfb-run -a npx electron --no-sandbox test/huge-library-ui-smoke.cjs --visual-preview
      # Diagnostic-only; no user data and no artifact upload. Allows comparing
      # Linux offscreen/Xvfb metrics with a visible Xvfb window on the same CI.
      - name: Profile Linux memory in normal Xvfb window (RSS/PSS)
        # Diagnostic runs are intentionally manual to preserve free Actions minutes.
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch'
        timeout-minutes: 4
        run: xvfb-run -a npx electron --no-sandbox test/huge-library-ui-smoke.cjs --windowed-memory-profile
      - if: runner.os == 'Windows'
        run: npm run dist:win
      - if: runner.os == 'Linux'
        run: npm run dist:linux
      - name: Verify Linux AppImage and DEB metadata, icon and launcher
        if: runner.os == 'Linux'
        run: bash scripts/verify-linux-packages.sh
      - name: Test Linux backup worker inside packaged ASAR
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox test/packaged-backup-smoke.cjs
      # Preserve installers for explicit release builds, without filling the
      # free artifact storage quota during routine PR/main validation.
      - uses: actions/upload-artifact@v4
        if: "github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'release: v'))"
        with:
          name: lnreader-desktop-${{ runner.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb

  user-journeys:
    name: 30 user journeys (Electron UI and backup stress)
    if: github.ref_name == 'main' || github.event_name == 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run setup
      - run: npm run build
      - name: Test 30 user journeys including UI, network and backup extremes
        run: npm run test:journeys
        timeout-minutes: 24
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: everyday-user-journeys
          path: desktop/.tmp/user-journeys-results.json

  source-matrix:
    name: Real plugin sources (diagnostic only)
    if: github.ref_name == 'seguranca-e-estabilidade' || github.ref_name == 'main' || github.event_name == 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run setup
      - run: npm run build
      - name: Test browser login cookie isolation
        run: npx electron test/auth-cookie-smoke.cjs
      - name: Test interactive source login and OAuth popup
        run: npx electron test/source-login-e2e.cjs
        timeout-minutes: 2
      - name: Central Novel route comparison (isolated source session)
        run: npx electron test/central-route-diagnostic.cjs --source-session
        timeout-minutes: 3
      - name: Test 16 independent sources
        run: node test/source-matrix.cjs
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: lnreader-source-matrix
          path: desktop/.tmp/source-matrix/
