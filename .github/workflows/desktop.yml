name: Desktop builds
on:
  workflow_dispatch:
    inputs:
      include_linux:
        description: 'Também compilar e testar Linux (port ainda pendente de validação)'
        type: boolean
        default: false
  # Keep automatic Windows packaging on the published main branch only.
  # The Linux development branch is deliberately not built on pushes.
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    name: Code quality and formatting (Desktop)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  desktop-only:
    name: Standalone Desktop build (no Android files)
    if: github.ref_name == 'seguranca-e-estabilidade' || github.ref_name == 'main' || github.event_name == 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          # Only desktop/ exists in this checkout. Parent Android sources,
          # package files, fonts and license are intentionally unavailable.
          sparse-checkout: desktop
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: node scripts/check-standalone.cjs
      - run: npm run setup
      - run: npm run build
      - run: npm test
      - run: npm run test:smoke
      - run: npm run test:reader

  package:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Prepare Linux headless test display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci
      - run: node scripts/check-standalone.cjs
      - run: npm run setup
      - run: npm run build
      - run: npm test
      - if: runner.os == 'Windows'
        run: npm run test:smoke
      - if: runner.os == 'Windows'
        run: npm run test:pagination
      - if: runner.os == 'Windows'
        run: npm run test:reader
      - name: Verify all ten interface languages and localized option choices
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: npx electron test/localization-smoke.cjs
      - name: Real public DNS and source-session HTTP probe
        if: runner.os == 'Windows'
        run: npx electron test/dns-public-smoke.cjs
      - if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox test/smoke.cjs --visual-preview
      - if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox test/pagination-smoke.cjs --visual-preview
      - if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox test/reader-rules-smoke.cjs --visual-preview
      - name: Ensure 10k-book library remains virtualized (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 4
        run: npx electron test/huge-library-ui-smoke.cjs --visual-preview
      - name: Ensure 10k-book library remains virtualized (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: xvfb-run -a npx electron --no-sandbox test/huge-library-ui-smoke.cjs --visual-preview
      - if: runner.os == 'Windows'
        run: npm run dist:win
      - if: runner.os == 'Linux'
        run: npm run dist:linux
      - name: Verify Linux AppImage and DEB metadata, icon and launcher
        if: runner.os == 'Linux'
        run: bash scripts/verify-linux-packages.sh
      - name: Test Linux backup worker inside packaged ASAR
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox test/packaged-backup-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: lnreader-desktop-${{ runner.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb

  user-journeys:
    name: Everyday reading scenarios (10 Electron journeys)
    if: github.ref_name == 'seguranca-e-estabilidade' || github.ref_name == 'main' || github.event_name == 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run setup
      - run: npm run build
      - name: Test 10 everyday user journeys from real reader issues
        run: npm run test:journeys
        timeout-minutes: 24
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: everyday-user-journeys
          path: desktop/.tmp/user-journeys-results.json

  source-matrix:
    name: Real plugin sources (diagnostic only)
    if: github.ref_name == 'seguranca-e-estabilidade' || github.ref_name == 'main' || github.event_name == 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run setup
      - run: npm run build
      - name: Test browser login cookie isolation
        run: npx electron test/auth-cookie-smoke.cjs
      - name: Test interactive source login and OAuth popup
        run: npx electron test/source-login-e2e.cjs
        timeout-minutes: 2
      - name: Central Novel route comparison (isolated source session)
        run: npx electron test/central-route-diagnostic.cjs --source-session
        timeout-minutes: 3
      - name: Test 16 independent sources
        run: node test/source-matrix.cjs
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lnreader-source-matrix
          path: desktop/.tmp/source-matrix/

  publish-v030:
    name: Publish LNReader Desktop v0.3.0 Beta
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release: v0.3.0')"
    needs: [quality, desktop-only, package, user-journeys, source-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lnreader-desktop-Windows
          path: release-artifacts
      - name: Publish tested Windows installer and create v0.3.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./desktop/package.json').version")" = "0.3.0"
          installer="$(find release-artifacts -type f -name '*.exe' -print -quit)"
          test -n "$installer" && test -s "$installer"
          if gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.3.0 release already exists; refusing to overwrite"
            exit 0
          fi
          gh release create v0.3.0 "$installer" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LNReader Desktop v0.3.0 (Beta)" \
            --notes-file desktop/docs/RELEASE_NOTES_0.3.0.md \
            --prerelease

  publish-v041:
    name: Publish LNReader Desktop v0.4.1 DNS fix
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release: v0.4.1')"
    needs: [quality, desktop-only, package, user-journeys, source-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lnreader-desktop-Windows
          path: release-artifacts
      - name: Publish tested v0.4.1 installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./desktop/package.json').version")" = "0.4.1"
          installer="$(find release-artifacts -type f -name '*.exe' -print -quit)"
          test -n "$installer" && test -s "$installer"
          if gh release view v0.4.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.4.1 already exists; refusing to replace a published release"
            exit 1
          fi
          gh release create v0.4.1 "$installer" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LNReader Desktop 0.4.1 Beta" \
            --notes-file desktop/docs/RELEASE_NOTES_0.4.1.md \
            --prerelease

  publish-v042:
    name: Publish LNReader Desktop v0.4.2
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release: v0.4.2')"
    needs: [quality, desktop-only, package, user-journeys, source-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lnreader-desktop-Windows
          path: release-artifacts
      - name: Publish tested Windows installer v0.4.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./desktop/package.json').version")" = "0.4.2"
          installer="$(find release-artifacts -type f -name '*.exe' -print -quit)"
          test -n "$installer" && test -s "$installer"
          if gh release view v0.4.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.4.2 release already exists; refusing to overwrite"
            exit 1
          fi
          gh release create v0.4.2 "$installer" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LNReader Desktop 0.4.2 Beta" \
            --notes-file desktop/docs/RELEASE_NOTES_0.4.2.md \
            --prerelease

  replace-v042-translation:
    name: Replace tested v0.4.2 installer and retarget existing tag
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'fix: v0.4.2 translation')"
    needs: [quality, desktop-only, package, user-journeys, source-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lnreader-desktop-Windows
          path: release-artifacts
      - name: Replace only the existing v0.4.2 release after full validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./desktop/package.json').version")" = "0.4.2"
          test -s desktop/docs/RELEASE_NOTES_0.4.2.md
          installer="$(find release-artifacts -type f -name '*.exe' -print -quit)"
          test -n "$installer" && test -s "$installer"
          # Keep the existing downloadable asset URL unchanged even if the
          # electron-builder output has spaces in its generated filename.
          target="release-artifacts/LNReader.Desktop.Setup.0.4.2.exe"
          if [ "$installer" != "$target" ]; then
            mv -- "$installer" "$target"
          fi
          installer="$target"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.4.2" --jq '.object.sha')"
          test "$tag_sha" = "74baeb5fa67364b107d97e4eb0b4b2204d5b3225"
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.4.2" --jq '.id')"
          test -n "$release_id"
          release_target="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.target_commitish')"
          test "$release_target" = "$tag_sha"
          # Moving the tag also refreshes GitHub's automatic source-code
          # ZIP and tar.gz links. No manual source archives are necessary.
          sha256sum "$installer"
          # User requested replacing the same version. Keep tag, source and
          # installer in agreement rather than publishing a mismatched binary.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.4.2" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release upload v0.4.2 "$installer" --clobber
          gh release edit v0.4.2 --notes-file desktop/docs/RELEASE_NOTES_0.4.2.md
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -f target_commitish="$GITHUB_SHA" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.4.2" --jq '.object.sha')" = "$GITHUB_SHA"
          gh release view v0.4.2 --json assets --jq '.assets[].name' |
            grep -Fx 'LNReader.Desktop.Setup.0.4.2.exe'

  publish-v043:
    name: Publish LNReader Desktop v0.4.3 Beta (Windows + Linux)
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release: v0.4.3')"
    needs: [quality, desktop-only, package, user-journeys, source-matrix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lnreader-desktop-Windows
          path: release-artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: lnreader-desktop-Linux
          path: release-artifacts/linux
      - name: Publish only the fully tested matching version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./desktop/package.json').version")" = "0.4.3"
          test -s desktop/docs/RELEASE_NOTES_0.4.3.md
          if gh release view v0.4.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.4.3 already published; refusing to replace it" >&2
            exit 1
          fi
          mapfile -t installers < <(find release-artifacts/windows -type f -name '*.exe')
          mapfile -t appimages < <(find release-artifacts/linux -type f -name '*.AppImage')
          mapfile -t debs < <(find release-artifacts/linux -type f -name '*.deb')
          test "${#installers[@]}" -eq 1
          test "${#appimages[@]}" -eq 1
          test "${#debs[@]}" -eq 1
          mkdir -p publish-files
          cp -- "${installers[0]}" publish-files/LNReader.Desktop.Setup.0.4.3.exe
          cp -- "${appimages[0]}" publish-files/LNReader.Desktop.0.4.3.AppImage
          cp -- "${debs[0]}" publish-files/LNReader.Desktop.0.4.3.amd64.deb
          for asset in publish-files/*; do test -s "$asset"; done
          sha256sum publish-files/*
          gh release create v0.4.3 publish-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LNReader Desktop 0.4.3 Beta (Windows + Linux)" \
            --notes-file desktop/docs/RELEASE_NOTES_0.4.3.md \
            --prerelease
          gh release view v0.4.3 --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,assets \
            --jq '{tag: .tagName, target: .targetCommitish, assets: [.assets[].name]}'
